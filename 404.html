<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="robots" content="noindex, follow"/>
<title>Pagina niet gevonden | Dutch Goose</title>
<meta name="description" content="Deze pagina bestaat niet of is verplaatst. Ga terug naar de homepage of kies een van onze hoofdsecties."/>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png"/>
<link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon-192.png"/>
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png"/>
<link rel="canonical" href="https://dutchgoose.nl/404.html"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{--t:#1a7c6b;--tl:#2a9d87;--tp:#e8f5f2;--tm:#c5e8e1;--cr:#faf8f4;--w:#fff;--tx:#1a2b28;--md:#4a6b64;--sf:#7a9b94;--bd:#d8ede8;--sh:0 2px 16px rgba(26,124,107,.08);--sl:0 8px 40px rgba(26,124,107,.14)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--cr);color:var(--tx);font-family:'Inter',sans-serif;font-size:16px;line-height:1.6;overflow-x:hidden;min-height:100vh;display:flex;flex-direction:column}
h1,h2,h3,h4{font-family:'Nunito',sans-serif;line-height:1.2}
a{color:inherit;text-decoration:none}
.main-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:3rem 5vw}
.card{background:var(--w);border:2px solid var(--bd);border-radius:24px;box-shadow:var(--sl);padding:2.5rem 1.75rem;max-width:560px;width:100%;text-align:center}
.errcode{font-family:'Nunito',sans-serif;font-weight:900;font-size:clamp(3.2rem,9vw,4.8rem);color:var(--t);letter-spacing:-.04em;line-height:1;margin-bottom:.4rem}
.eyebrow{font-size:.69rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--t);font-family:'Nunito',sans-serif;margin-bottom:.6rem}
h1{font-size:clamp(1.4rem,4.5vw,1.9rem);font-weight:900;letter-spacing:-.02em;margin-bottom:.8rem;color:var(--tx)}
.lead{font-size:.95rem;color:var(--md);line-height:1.65;margin-bottom:2rem;max-width:440px;margin-left:auto;margin-right:auto}
.cta-grid{display:grid;gap:.7rem;max-width:340px;margin:0 auto}
.cta{font-family:'Nunito',sans-serif;font-weight:800;font-size:.95rem;padding:.95rem 1.4rem;border-radius:100px;display:flex;align-items:center;justify-content:center;gap:.5rem;transition:transform .15s,opacity .15s,background .2s;border:2px solid transparent}
.cta:hover{transform:translateY(-2px)}
.cta-primary{background:var(--t);color:#fff}
.cta-primary:hover{background:var(--tl)}
.cta-secondary{background:var(--tp);color:var(--t);border-color:var(--tm)}
.cta-secondary:hover{background:var(--tm)}
.help-line{font-size:.82rem;color:var(--sf);margin-top:1.6rem}
.help-line a{color:var(--t);font-weight:700}
nav{position:sticky;top:0;z-index:100;background:var(--w);border-bottom:2px solid var(--tm);padding:.75rem 5vw;display:flex;align-items:center;justify-content:space-between;min-height:68px;height:auto;box-shadow:0 2px 12px rgba(26,124,107,.07)}
.logo{display:flex;align-items:center;gap:.6rem;min-width:0}
.logo-copy{min-width:0}
.lt{font-size:1.2rem;font-weight:900;color:var(--t);letter-spacing:-.02em;font-family:'Nunito',sans-serif}
.ls{font-size:.62rem;color:var(--sf);font-weight:500;display:block;letter-spacing:.04em;text-transform:uppercase;line-height:1;margin-top:1px}
.nl{display:flex;gap:.2rem;list-style:none}
.nl a{font-size:.83rem;font-weight:600;color:var(--md);padding:.4rem .75rem;border-radius:8px;transition:background .15s,color .15s}
.nl a:hover,.nl a.on{background:var(--tp);color:var(--t)}
.ns{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--md);transition:background .15s,color .15s}
.ns:hover{background:var(--tp);color:var(--t)}
.nav-actions{display:flex;align-items:center;gap:.3rem;flex-shrink:0}
.nc{background:var(--t);color:white;font-family:'Nunito',sans-serif;font-weight:800;font-size:.83rem;padding:.48rem 1.1rem;border-radius:100px;margin-left:.35rem;transition:background .2s;display:inline-flex;align-items:center;gap:.3rem}
.nc:hover{background:var(--tl)}
footer{background:var(--tx);color:white;padding:3.5rem 5vw 2rem}
.fg{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;gap:2.5rem;margin-bottom:2rem;max-width:1160px}
.flo{font-size:1.1rem;font-weight:900;color:#2a9d87;margin-bottom:.55rem;font-family:'Nunito',sans-serif}
.fbr p{font-size:.8rem;color:rgba(255,255,255,.5);line-height:1.55;max-width:200px}
.fc h4{font-size:.67rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.37);margin-bottom:.75rem;font-family:'Nunito',sans-serif}
.fc ul{list-style:none;display:flex;flex-direction:column;gap:.48rem}
.fc a{font-size:.82rem;color:rgba(255,255,255,.58);transition:color .2s}
.fc a:hover{color:white}
.fbot{display:flex;justify-content:space-between;align-items:center;padding-top:1.2rem;border-top:1px solid rgba(255,255,255,.07);font-size:.75rem;color:rgba(255,255,255,.37);max-width:1160px}
@media(max-width:900px){nav .nl{display:none}.fg{grid-template-columns:1fr 1fr;gap:1.5rem}}
@media(max-width:560px){
  .main-wrap{padding:2rem 4vw}
  .card{padding:2rem 1.25rem;border-radius:20px}
  .lead{font-size:.92rem;margin-bottom:1.6rem}
  .cta{font-size:.92rem;padding:.9rem 1.2rem}
  nav{align-items:flex-start;gap:.6rem;padding:.75rem 5vw 1rem}
  .logo{align-items:flex-start;flex:1}
  .logo img{width:38px!important;height:38px!important}
  .logo-copy{display:flex;flex-direction:column;justify-content:center;padding-top:.08rem}
  .lt{font-size:.94rem}
  .ls{max-width:14ch;white-space:normal;font-size:.54rem}
  .nav-actions{padding-top:.02rem;margin-left:.25rem}
  .nav-actions .ns{display:none}
  .nc{padding:.34rem .54rem;font-size:.58rem;gap:.14rem}
}
</style>
</head>
<body>
<nav id="nav-placeholder"></nav>
<script src="/assets/nav.js?v=5"></script>

<main class="main-wrap">
  <div class="card">
    <div class="errcode">404</div>
    <div class="eyebrow">Pagina niet gevonden</div>
    <h1>Pagina niet gevonden</h1>
    <p class="lead">Deze pagina bestaat niet of is verplaatst. Geen zorgen, kies hieronder waar je heen wilt.</p>
    <div class="cta-grid">
      <a class="cta cta-primary" href="/">🏠 Naar de homepage</a>
      <a class="cta cta-secondary" href="/blog.html">📚 Blog &amp; kennisbank</a>
      <a class="cta cta-secondary" href="/recepten/">🥗 Recepten</a>
      <a class="cta cta-secondary" href="/tools.html">🔧 Tools</a>
    </div>
    <p class="help-line">Iets specifieks zoeken? <a href="/contact.html">Stuur ons een bericht</a>.</p>
  </div>
</main>

<footer id="footer-placeholder"></footer>
<script src="/assets/footer.js?v=2"></script>
</body>
</html>
